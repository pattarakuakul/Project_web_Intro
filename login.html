<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ | KMUTNB ปราจีนบุรี</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="login-wrap">
  <div class="login-photo">
    <img src="assets/photos/unnamed.webp" alt="อาคารมหาวิทยาลัย">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="assets/icons/logo.png" alt="KMUTNB" style="height:46px;">
    </a>
  </div>
  <div class="login-side">
    <div class="login-box">
      <h1>เข้าสู่ระบบ</h1>
      <form>
        <div class="field">
          <label for="email">email</label>
          <input type="email" id="email" placeholder="name@example.com">
        </div>
        <div class="field">
          <label for="password">password</label>
          <input type="password" id="password" placeholder="••••••••">
        </div>
        <a href="notifications.html" class="btn btn-orange" style="width:100%;margin-top:6px;padding:11px;">เข้าสู่ระบบ</a>
      </form>
      <div class="oauth-row">
        <a href="notifications.html" class="oauth-btn"><img src="assets/icons/google.png" alt=""> google</a>
        <a href="notifications.html" class="oauth-btn"><img src="assets/icons/thaid.png" alt=""> ThaiID</a>
      </div>
      <p class="login-hint">การเข้าสู่ระบบถือว่าคุณยอมรับข้อกำหนดการใช้งาน<br>และนโยบายความเป็นส่วนตัวของมหาวิทยาลัย</p>
    </div>
  </div>
</main>
</body>
</html>
